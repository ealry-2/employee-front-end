name: Build and Deploy Employee App

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: employee-app-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VITE_API_BASE_URL: https://api.il-log.com

jobs:
  build-and-push:
    name: Test, Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            /.dockerignore
            /.env.development
            /.env.example
            /Dockerfile
            /package.json
            /package-lock.json
            /tsconfig.json
            /vite.config.ts
            /capacitor.config.ts
            /index.html
            /src/**
            /test/**
            /public/**
            /nginx/**
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build static assets
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          target: prebuilt-runtime
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy Employee App to Oracle VM
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate deploy secrets
        env:
          ORACLE_SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          APP_DIR: ${{ secrets.APP_DIR }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -eu

          missing=""
          for name in ORACLE_SSH_HOST ORACLE_SSH_USER ORACLE_SSH_KEY APP_DIR GHCR_USERNAME GHCR_TOKEN; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              missing="${missing} ${name}"
            fi
          done

          if [ -n "$missing" ]; then
            echo "Missing deploy secret(s):${missing}"
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_SSH_HOST }}
          username: ${{ secrets.ORACLE_SSH_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -eu

            APP_DIR="${{ secrets.APP_DIR }}"
            COMPOSE_FILE="docker-compose.prod.yml"

            if [ -z "$APP_DIR" ]; then
              echo "APP_DIR secret is empty"
              exit 1
            fi

            cd "$APP_DIR"

            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "Missing compose file: $APP_DIR/$COMPOSE_FILE"
              exit 1
            fi

            export EMPLOYEE_APP_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

            printf '%s\n' "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            if ! docker compose -f "$COMPOSE_FILE" config --services | grep -qx employee-app; then
              echo "employee-app service is missing from $APP_DIR/$COMPOSE_FILE"
              exit 1
            fi

            docker compose -f "$COMPOSE_FILE" pull employee-app
            docker compose -f "$COMPOSE_FILE" up -d employee-app
            docker compose -f "$COMPOSE_FILE" ps employee-app

            docker image prune -f
